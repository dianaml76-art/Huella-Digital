name: Build and Sign Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle 9.3.1
      run: |
        wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
        unzip -q gradle-9.3.1-bin.zip
        echo "$(pwd)/gradle-9.3.1/bin" >> $GITHUB_PATH

    - name: Set headless mode
      run: echo "JAVA_OPTS=-Djava.awt.headless=true" >> $GITHUB_ENV

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

    - name: Set environment variables
      run: |
        echo "KEYSTORE_PATH=app/keystore.jks" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
        echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
        echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

    - name: Build signed APK
      run: gradle assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HuellaSegura-APK
        path: app/build/outputs/apk/release/*.apk
