name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Clean
        run: gradle clean

      - name: Build Debug APK
        id: build
        run: |
          gradle assembleDebug --stacktrace --info --no-daemon 2>&1 | tee build.log
          if [ $? -ne 0 ]; then
            echo "build_failed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload build log if failed
        if: steps.build.outputs.build_failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: steps.build.outputs.build_failed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HuellaDigital-debug
          path: app/build/outputs/apk/debug/*.apk
